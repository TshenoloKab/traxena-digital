<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traxena Digital | Build. Innovate. Grow.</title>
    <meta name="description" content="Traxena Digital designs professional websites and practical digital solutions for service providers and small businesses in Botswana and beyond." />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('traxena-theme'); } catch (error) {
          // Storage unavailable; fall back to the default light theme.
        }
        var theme = stored === 'dark' || stored === 'light' ? stored : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', theme === 'dark' ? '#08101F' : '#FFFFFF');
      })();
    </script>
    <meta property="og:title" content="Traxena Digital | Build. Innovate. Grow." />
    <meta property="og:description" content="Traxena Digital designs professional websites and practical digital solutions for service providers and small businesses in Botswana and beyond." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
