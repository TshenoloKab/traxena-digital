<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 128" role="img" aria-labelledby="title desc" fill="none">
  <title id="title">Traxena Digital logo</title>
  <desc id="desc">Connected wordmark with a blue to violet x and the tagline Build. Innovate. Grow.</desc>
  <rect width="430" height="128" fill="#ffffff" />
  <defs>
    <linearGradient id="traxena-x" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <text x="24" y="72" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="68" font-weight="700" fill="#172554" letter-spacing="-3">Tra</text>
  <text x="138" y="72" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="68" font-weight="700" fill="url(#traxena-x)" letter-spacing="-3">x</text>
  <text x="176" y="72" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="68" font-weight="700" fill="#172554" letter-spacing="-3">ena</text>
  <path d="M31 78H126" stroke="#2563eb" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <text x="24" y="101" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#334155" letter-spacing="4">DIGITAL</text>
  <text x="24" y="121" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#8b5cf6" letter-spacing="2.2">BUILD. INNOVATE. GROW.</text>
</svg>
